[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-security-scanner"
version = "1.0.0"
description = "Static analysis scanner that flags malicious code, secrets-adjacent patterns and vulnerable dependencies in a repository before you clone it"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "colorama>=0.4.6",
    "tqdm>=4.64.0",
]

[project.scripts]
repo-scanner = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["repo_scanner*"]
